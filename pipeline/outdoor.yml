# Planetiler custom schema: data that the OpenMapTiles schema does not carry, but an enduro rider needs.
#   tracks  - tracks/paths with tracktype, surface, smoothness and access tags
#   access  - ordinary roads closed to motor vehicles
#   roads   - roads with explicit maxspeed (speed limit display)
# Contours are merged into the same archive later by tile-join (layer "contours").
schema_name: Moje Mapy Outdoor
schema_description: Tracktype, access and maxspeed overlay for enduro riding
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>
version: 1.0.0
is_overlay: true

args:
  osm_path:
    description: Local .osm.pbf to read
    default: data/area.osm.pbf
  maxzoom: 14
  minzoom: 0

sources:
  osm:
    type: osm
    local_path: '${ args.osm_path }'

layers:
  - id: tracks
    features:
      - source: osm
        geometry: line
        min_zoom: 10
        include_when:
          highway: [track, path, bridleway, cycleway, footway]
        exclude_when:
          __any__:
            - area: "yes"
            - footway: [sidewalk, crossing]
        attributes:
          - key: highway
            tag_value: highway
          - key: tracktype
            tag_value: tracktype
          - key: surface
            tag_value: surface
          - key: smoothness
            tag_value: smoothness
            min_zoom: 12
          - key: mtb_scale
            tag_value: "mtb:scale"
            min_zoom: 12
          - key: sac_scale
            tag_value: sac_scale
            min_zoom: 12
          - key: name
            tag_value: name
            min_zoom: 13
          - key: access
            tag_value: access
          - key: motor_vehicle
            tag_value: motor_vehicle
          - key: motorcycle
            tag_value: motorcycle
          - key: vehicle
            tag_value: vehicle
    tile_post_process:
      merge_line_strings:
        min_length: 0.5
        min_length_at_max_zoom: 0
        tolerance: 0.5
        tolerance_at_max_zoom: 0.125
        buffer: 4

  - id: access
    features:
      - source: osm
        geometry: line
        min_zoom: 11
        include_when:
          __all__:
            - highway: [primary, secondary, tertiary, unclassified, residential, service, living_street, road]
            - __any__:
                - access: ["no", private, forestry, agricultural, delivery]
                - motor_vehicle: ["no", private, forestry, agricultural, delivery, agricultural;forestry]
                - motorcycle: ["no", private]
                - vehicle: ["no", private, forestry, agricultural]
        attributes:
          - key: highway
            tag_value: highway
          - key: access
            tag_value: access
          - key: motor_vehicle
            tag_value: motor_vehicle
          - key: motorcycle
            tag_value: motorcycle
          - key: vehicle
            tag_value: vehicle
    tile_post_process:
      merge_line_strings:
        min_length: 0.5
        tolerance: 0.5
        buffer: 4

  - id: roads
    features:
      - source: osm
        geometry: line
        min_zoom: 13
        include_when:
          __all__:
            - maxspeed: __any__
            - highway:
                - motorway
                - motorway_link
                - trunk
                - trunk_link
                - primary
                - primary_link
                - secondary
                - secondary_link
                - tertiary
                - tertiary_link
                - unclassified
                - residential
                - living_street
                - service
                - track
        attributes:
          - key: highway
            tag_value: highway
          - key: maxspeed
            tag_value: maxspeed
