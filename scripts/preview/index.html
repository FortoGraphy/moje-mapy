<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Moje Mapy – náhled stylu</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; background: #0B0E13; }
    #bar { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; gap: 6px; }
    #bar button { background: #141920; color: #F3F6FA; border: 1px solid #2C3643; border-radius: 8px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div id="bar">
    <button onclick="setStyle('enduro')">enduro</button>
    <button onclick="setStyle('road')">road</button>
    <button onclick="setStyle('topo')">topo</button>
  </div>
  <div id="map"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const style = params.get("style") || "enduro";
    const map = new maplibregl.Map({
      container: "map",
      style: style + ".json",
      center: [Number(params.get("lon") || 16.62), Number(params.get("lat") || 49.2)],
      zoom: Number(params.get("z") || 12),
    });
    const icons = new Set();
    map.on("styleimagemissing", (e) => {
      if (icons.has(e.id)) return;
      icons.add(e.id);
      const img = new Image();
      img.onload = () => { if (!map.hasImage(e.id)) map.addImage(e.id, img, { pixelRatio: 2 }); };
      img.src = "../../assets/map-icons/" + e.id + "@2x.png";
    });
    function setStyle(s) { icons.clear(); map.setStyle(s + ".json"); }
    window.map = map;
  </script>
</body>
</html>
