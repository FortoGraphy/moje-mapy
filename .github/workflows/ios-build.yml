name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "development = dev-client (JS z PC přes Metro), release = samostatná appka"
        type: choice
        options: [development, release]
        default: development
  push:
    tags: ["v*"]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      VARIANT: ${{ github.event.inputs.variant || 'release' }}
      EXPO_PUBLIC_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode version (Expo SDK 57 needs 26.4+)
        run: |
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode $V"
          printf '%s\n26.4\n' "$V" | sort -V -C -r || { echo "::error::Xcode $V is older than 26.4"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          CONFIG=$([ "$VARIANT" = "development" ] && echo Debug || echo Release)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|^\*\* BUILD" build.log | sort -u | head -n 80 || true
          if [ $STATUS -ne 0 ]; then
            echo "::group::Last 200 lines of build.log"
            tail -n 200 build.log
            echo "::endgroup::"
            exit $STATUS
          fi
          APP="build/Build/Products/${CONFIG}-iphoneos/${SCHEME}.app"
          test -f "$APP/Info.plist"
          if [ "$CONFIG" = "Release" ]; then test -f "$APP/main.jsbundle"; fi

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/${CONFIG}-iphoneos/${SCHEME}.app" Payload/
          IPA="MojeMapy-${VARIANT}-$(date +%Y%m%d-%H%M).ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: MojeMapy-${{ env.VARIANT }}
          path: ${{ env.IPA }}
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
